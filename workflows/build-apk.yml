name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar tu página web dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/www
          tar --exclude=./android --exclude=./.github --exclude=./.git --exclude='*.md' --exclude='*.txt' -cf - . | tar -xf - -C android/app/src/main/assets/www
          NAME=$(jq -r '.short_name // .name // "Mi App"' manifest.json 2>/dev/null || echo "Mi App")
          NAME=$(echo "$NAME" | tr -d "'\"<>&@")
          printf '<resources><string name="app_name">%s</string></resources>\n' "$NAME" > android/app/src/main/res/values/strings.xml
          if [ -f img/icon-512.png ]; then cp img/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi

      - name: Construir el APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Guardar el APK como archivo del proceso
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
