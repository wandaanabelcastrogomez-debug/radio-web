<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1033">
<meta name="description" content="Escucha nuestra radio en vivo, conoce la programación y contáctanos.">
<title>Mi Radio en Vivo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" href="img/icon-192.png">
<style>
:root{--acc:#ec4899;--bg1:#1a1033;--bg2:#0b0718;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#f5f3ff;--mut:#b8b0d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 50% -10%,#3b1d7a 0%,var(--bg1) 45%,var(--bg2) 100%) fixed;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center;padding:18px 0 6px}
.logo{font-size:3rem;line-height:1}
h1{margin:6px 0 2px;font-size:2rem}
.slogan{color:var(--mut);margin:0}
.freq{display:inline-block;margin-top:8px;padding:3px 14px;border-radius:99px;border:1px solid var(--bd);font-weight:700;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:18px;backdrop-filter:blur(6px)}
h2{margin:0 0 12px;font-size:1.15rem}
/* Reproductor */
.player{text-align:center}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.08em;font-size:.8rem;color:var(--mut)}
.live i{width:10px;height:10px;border-radius:50%;background:#6b7280}
.on .live{color:#fff}
.on .live i{background:#ef4444;animation:pulso 1.2s infinite}
@keyframes pulso{50%{opacity:.3}}
.eq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:46px;margin:14px 0}
.eq b{width:8px;height:8px;border-radius:4px;background:var(--acc);transition:height .2s}
.on .eq b{animation:eq 0.9s infinite ease-in-out}
.on .eq b:nth-child(2){animation-delay:.15s}.on .eq b:nth-child(3){animation-delay:.3s}
.on .eq b:nth-child(4){animation-delay:.45s}.on .eq b:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:8px}50%{height:44px}}
#play{width:88px;height:88px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:2.2rem;cursor:pointer;box-shadow:0 8px 30px rgba(236,72,153,.5)}
#play:active{transform:scale(.96)}
.ahora{margin-top:14px;color:var(--mut);font-size:.95rem}
.ahora b{color:var(--tx)}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;color:var(--mut)}
.vol input{width:min(260px,60%);accent-color:var(--acc)}
#aviso{margin-top:12px;font-size:.9rem;color:#fbbf24;min-height:1.2em}
/* Programación */
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.dias button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer}
.dias button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.prog{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.prog:last-child{border-bottom:none}
.hora{flex:none;width:96px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mut);font-size:.9rem}
.prog .t{flex:1}
.prog .t b{display:block}
.prog .t span{color:var(--mut);font-size:.88rem}
.prog.ya{background:rgba(236,72,153,.15);border-radius:12px;padding-left:10px;padding-right:10px}
.tag{flex:none;background:var(--acc);color:#fff;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px}
.vacio{color:var(--mut);text-align:center;padding:14px 0}
/* Contacto */
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.btn{display:block;text-align:center;text-decoration:none;color:var(--tx);border:1px solid var(--bd);padding:13px;border-radius:14px;font-weight:700;background:rgba(255,255,255,.05)}
.btn.f{background:#16a34a;border-color:#16a34a;color:#fff}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:26px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo" id="logo"></div>
    <h1 id="nombre"></h1>
    <p class="slogan" id="slogan"></p>
    <span class="freq" id="freq"></span>
  </header>

  <section class="card player" id="reproductor">
    <div class="live"><i></i><span id="estado">EN VIVO</span></div>
    <div class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
    <button id="play" aria-label="Reproducir">▶</button>
    <div class="ahora" id="ahora"></div>
    <div class="vol">🔈 <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen"> 🔊</div>
    <div id="aviso"></div>
  </section>

  <section class="card">
    <h2>📅 Programación</h2>
    <div class="dias" id="dias"></div>
    <div id="programas"></div>
  </section>

  <section class="card">
    <h2>📞 Contáctanos</h2>
    <div class="btns" id="contacto"></div>
  </section>

  <section class="card" id="cRedes">
    <h2>🌐 Síguenos</h2>
    <div class="btns" id="redes"></div>
  </section>

  <footer id="pie"></footer>
</div>

<script>
// =====================================================================
//  ✏️  CONFIGURACIÓN  -  CAMBIA SOLO ESTA PARTE CON LOS DATOS DE TU RADIO
// =====================================================================
var CONFIG = {
  nombre: "Mi Radio en Vivo",
  slogan: "La música que te acompaña todo el día",
  logo: "📻",                       // un emoji o letra
  frecuencia: "98.5 FM",            // o "Radio online 24/7"
  color: "#ec4899",                 // color principal

  // Dirección del stream de audio. Debe empezar con https://
  // Ejemplo: "https://tuservidor.com:8000/stream"
  streamUrl: "",

  zonaHoraria: "America/Santo_Domingo",

  // Programación semanal. dias: 0=Domingo, 1=Lunes ... 6=Sábado
  programacion: [
    { dias: [1,2,3,4,5], inicio: "06:00", fin: "10:00", programa: "Buenos Días", locutor: "Con tu locutor favorito" },
    { dias: [1,2,3,4,5], inicio: "10:00", fin: "14:00", programa: "Música sin parar", locutor: "Los mejores éxitos" },
    { dias: [1,2,3,4,5], inicio: "14:00", fin: "18:00", programa: "La Tarde Contigo", locutor: "Noticias y entrevistas" },
    { dias: [1,2,3,4,5], inicio: "18:00", fin: "22:00", programa: "Noche Romántica", locutor: "Dedicatorias y baladas" },
    { dias: [6],         inicio: "08:00", fin: "14:00", programa: "Sábado Alegre", locutor: "Música y diversión" },
    { dias: [0],         inicio: "09:00", fin: "13:00", programa: "Domingo en Familia", locutor: "Música para compartir" }
  ],

  // Contacto (deja "" lo que no uses)
  whatsapp: "",                     // con código de país, ej: "18091234567"
  telefono: "",                     // ej: "18091234567"
  correo: "",                       // ej: "radio@correo.com"

  // Redes sociales: nombre y dirección
  redes: [
    // { nombre: "Facebook", url: "https://facebook.com/tuRadio" },
    // { nombre: "Instagram", url: "https://instagram.com/tuRadio" },
    // { nombre: "YouTube", url: "https://youtube.com/@tuRadio" }
  ]
};
// =====================================================================
//  FIN DE LA CONFIGURACIÓN  (no necesitas cambiar nada de aquí hacia abajo)
// =====================================================================

var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

// ---------- Lógica de horarios ----------
function aMin(hhmm){ var p = hhmm.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }

function ahoraEnZona(fecha){
  var f = new Intl.DateTimeFormat('en-US', { timeZone: CONFIG.zonaHoraria, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
  var partes = {};
  f.formatToParts(fecha || new Date()).forEach(function(p){ partes[p.type] = p.value; });
  var mapa = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  var h = parseInt(partes.hour, 10) % 24;
  return { dia: mapa[partes.weekday], min: h * 60 + parseInt(partes.minute, 10) };
}

function enElAire(p, dia, min){
  var ini = aMin(p.inicio), fin = aMin(p.fin);
  if (ini < fin) return p.dias.indexOf(dia) >= 0 && min >= ini && min < fin;
  // programa que cruza la medianoche (ej: 22:00 a 02:00)
  if (p.dias.indexOf(dia) >= 0 && min >= ini) return true;
  var ayer = (dia + 6) % 7;
  return p.dias.indexOf(ayer) >= 0 && min < fin;
}

function programaActual(fecha){
  var a = ahoraEnZona(fecha);
  for (var i = 0; i < CONFIG.programacion.length; i++) {
    if (enElAire(CONFIG.programacion[i], a.dia, a.min)) return CONFIG.programacion[i];
  }
  return null;
}

function programasDelDia(dia){
  return CONFIG.programacion.filter(function(p){ return p.dias.indexOf(dia) >= 0; })
    .sort(function(a, b){ return aMin(a.inicio) - aMin(b.inicio); });
}

function hora12(hhmm){
  var m = aMin(hhmm), h = Math.floor(m / 60), mm = ('0' + (m % 60)).slice(-2);
  var suf = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;
  return h + ':' + mm + ' ' + suf;
}

function limpiarUrl(u){
  u = String(u || '').trim();
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(u)) return 'https://' + u;
  return '';
}

// ---------- Interfaz ----------
function $(id){ return document.getElementById(id); }

function iniciarTextos(){
  document.documentElement.style.setProperty('--acc', CONFIG.color);
  document.title = CONFIG.nombre;
  $('logo').textContent = CONFIG.logo;
  $('nombre').textContent = CONFIG.nombre;
  $('slogan').textContent = CONFIG.slogan;
  $('freq').textContent = CONFIG.frecuencia;
  $('pie').textContent = '© ' + new Date().getFullYear() + ' ' + CONFIG.nombre + ' · Todos los derechos reservados';
}

function pintarAhora(){
  var p = programaActual();
  var el = $('ahora'); el.innerHTML = '';
  if (p) {
    el.appendChild(document.createTextNode('Al aire ahora: '));
    var b = document.createElement('b'); b.textContent = p.programa; el.appendChild(b);
  } else {
    el.textContent = 'Música continua';
  }
}

var diaVista = ahoraEnZona().dia;
function pintarProgramacion(){
  var cont = $('dias'); cont.innerHTML = '';
  for (var d = 0; d < 7; d++) {
    (function(d){
      var b = document.createElement('button');
      b.textContent = DIAS[d].substr(0, 3);
      b.setAttribute('aria-label', DIAS[d]);
      if (d === diaVista) b.className = 'on';
      b.onclick = function(){ diaVista = d; pintarProgramacion(); };
      cont.appendChild(b);
    })(d);
  }
  var lista = $('programas'); lista.innerHTML = '';
  var progs = programasDelDia(diaVista);
  if (!progs.length) { var v = document.createElement('div'); v.className = 'vacio'; v.textContent = 'Música continua este día'; lista.appendChild(v); }
  var actual = programaActual();
  var hoy = ahoraEnZona().dia === diaVista;
  progs.forEach(function(p){
    var f = document.createElement('div');
    var ya = hoy && actual === p;
    f.className = 'prog' + (ya ? ' ya' : '');
    var h = document.createElement('div'); h.className = 'hora'; h.textContent = hora12(p.inicio) + ' - ' + hora12(p.fin);
    var t = document.createElement('div'); t.className = 't';
    var n = document.createElement('b'); n.textContent = p.programa;
    var l = document.createElement('span'); l.textContent = p.locutor || '';
    t.appendChild(n); t.appendChild(l);
    f.appendChild(h); f.appendChild(t);
    if (ya) { var g = document.createElement('span'); g.className = 'tag'; g.textContent = 'AL AIRE'; f.appendChild(g); }
    lista.appendChild(f);
  });
}

function boton(texto, url, verde){
  var a = document.createElement('a');
  a.className = 'btn' + (verde ? ' f' : ''); a.textContent = texto; a.href = url;
  if (/^https?:/i.test(url)) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}
function pintarContacto(){
  var c = $('contacto'); c.innerHTML = '';
  var wa = String(CONFIG.whatsapp || '').replace(/\D/g, '');
  var tel = String(CONFIG.telefono || '').replace(/\D/g, '');
  if (wa) c.appendChild(boton('💬 WhatsApp', 'https://wa.me/' + wa, true));
  if (tel) c.appendChild(boton('📞 Llamar', 'tel:+' + tel));
  if (CONFIG.correo && /^\S+@\S+\.\S+$/.test(CONFIG.correo)) c.appendChild(boton('✉️ Correo', 'mailto:' + CONFIG.correo));
  if (!c.children.length) { var v = document.createElement('div'); v.className = 'vacio'; v.textContent = 'Próximamente'; c.appendChild(v); }

  var r = $('redes'); r.innerHTML = '';
  (CONFIG.redes || []).forEach(function(x){
    var u = limpiarUrl(x.url);
    if (u && x.nombre) r.appendChild(boton(x.nombre, u));
  });
  if (!r.children.length) $('cRedes').style.display = 'none';
}

// ---------- Reproductor ----------
var audio = new Audio();
audio.preload = 'none';
var sonando = false;

function estado(on, texto){
  sonando = on;
  $('reproductor').className = 'card player' + (on ? ' on' : '');
  $('play').textContent = on ? '⏸' : '▶';
  $('play').setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
  $('estado').textContent = texto || (on ? 'EN VIVO' : 'PAUSADO');
}
function aviso(t){ $('aviso').textContent = t || ''; }

function reproducir(){
  var url = limpiarUrl(CONFIG.streamUrl);
  if (!url) { aviso('⚠️ Falta configurar la dirección del stream (streamUrl) en index.html.'); return; }
  if (location.protocol === 'https:' && /^http:/i.test(CONFIG.streamUrl)) {
    aviso('⚠️ El stream debe empezar con https:// para funcionar en una página segura.'); return;
  }
  aviso(''); estado(true, 'CONECTANDO...');
  audio.src = url;
  audio.play().then(function(){ estado(true, 'EN VIVO'); }).catch(function(){
    estado(false, 'SIN SEÑAL');
    aviso('No se pudo conectar con la radio. Intenta de nuevo en unos segundos.');
  });
}
function pausar(){
  audio.pause();
  audio.removeAttribute('src'); audio.load();   // corta la descarga del stream
  estado(false, 'PAUSADO');
}

$('play').onclick = function(){ sonando ? pausar() : reproducir(); };
$('vol').oninput = function(){ audio.volume = parseFloat(this.value); };
audio.volume = 0.8;
audio.addEventListener('error', function(){
  if (!audio.getAttribute('src')) return;
  estado(false, 'SIN SEÑAL'); aviso('Se perdió la conexión con la radio. Pulsa ▶ para reconectar.');
});
audio.addEventListener('waiting', function(){ if (sonando) $('estado').textContent = 'CARGANDO...'; });
audio.addEventListener('playing', function(){ $('estado').textContent = 'EN VIVO'; });

// Controles en la pantalla de bloqueo del celular
if ('mediaSession' in navigator && window.MediaMetadata) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: CONFIG.nombre, artist: CONFIG.slogan,
    artwork: [{ src: 'img/icon-512.png', sizes: '512x512', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', reproducir);
  navigator.mediaSession.setActionHandler('pause', pausar);
}

// ---------- Inicio ----------
iniciarTextos();
pintarContacto();
pintarAhora();
pintarProgramacion();
setInterval(function(){ pintarAhora(); pintarProgramacion(); }, 60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
}
</script>
</body>
</html>
